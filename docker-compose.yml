services:
  postgres:
    image: postgres:17-alpine
    container_name: nextime-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nextime}
      POSTGRES_USER: ${POSTGRES_USER:-nextime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nextime}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - nextime-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nextime} -d ${POSTGRES_DB:-nextime}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nextime-postgres-data:
