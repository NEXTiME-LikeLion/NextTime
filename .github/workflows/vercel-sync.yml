## Vercel Git 연동은 Organization이 아니라 fork한 jiminxha 개인 레포에 연결되어 있음
## Organization에서 대상 브랜치에 push(merge)되면, 같은 브랜치를 fork에 force-push 한다.
## fork 브랜치가 갱신되면 Vercel Git 연동이 자동 재배포한다.
##
## Production 전환:
## - Organization main → fork main 싱크
## - Vercel Production Branch를 fork의 main으로 변경한 뒤 재배포
##
## frontend 브랜치도 전환 기간 동안 계속 싱크한다.
## Vercel Production을 main으로 바꾼 뒤에는 frontend 트리거를 제거해도 된다.

name: Vercel Sync

on:
  push:
    branches: ["frontend", "main"]
  workflow_dispatch:

concurrency:
  group: vercel-sync-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync-to-fork:
    if: github.repository == 'NEXTiME-LikeLion/NextTime'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push current branch to fork
        env:
          AUTO_ACTIONS: ${{ secrets.AUTO_ACTIONS }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ -z "${AUTO_ACTIONS}" ]; then
            echo "::error::AUTO_ACTIONS secret is empty."
            exit 1
          fi

          AUTH_HEADER="Authorization: Bearer ${AUTO_ACTIONS}"
          USER_CODE="$(curl -sS -o /tmp/gh-user.json -w "%{http_code}" \
            -H "${AUTH_HEADER}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/user || true)"
          REPO_CODE="$(curl -sS -o /tmp/gh-fork.json -w "%{http_code}" \
            -H "${AUTH_HEADER}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/jiminxha/NextTime || true)"

          LOGIN="$(python3 -c "import json; print(json.load(open('/tmp/gh-user.json')).get('login','unknown'))" 2>/dev/null || echo unknown)"
          PUSHABLE="$(python3 -c "import json; print(json.load(open('/tmp/gh-fork.json')).get('permissions',{}).get('push', False))" 2>/dev/null || echo unknown)"

          echo "AUTO_ACTIONS user=${LOGIN} user_http=${USER_CODE} fork_http=${REPO_CODE} fork_push=${PUSHABLE}"

          if [ "${USER_CODE}" = "401" ] || [ "${USER_CODE}" = "403" ]; then
            echo "::error::AUTO_ACTIONS is invalid or expired (HTTP ${USER_CODE}). Recreate a PAT with write access to jiminxha/NextTime and update the secret."
            exit 1
          fi

          if [ "${PUSHABLE}" != "True" ] && [ "${PUSHABLE}" != "true" ]; then
            echo "::error::AUTO_ACTIONS (${LOGIN}) cannot push to jiminxha/NextTime. Grant Contents: Write on the fork, then update the secret."
            exit 1
          fi

          # checkout이 남긴 GITHUB_TOKEN Authorization 헤더가
          # fork URL에도 붙으면 AUTO_ACTIONS 대신 org 토큰으로 push되어 128이 난다.
          git config --unset-all http.https://github.com/.extraheader || true

          {
            echo '#!/bin/sh'
            echo 'printf %s "$AUTO_ACTIONS"'
          } > /tmp/git-askpass.sh
          chmod +x /tmp/git-askpass.sh

          set +e
          GIT_TERMINAL_PROMPT=0 GIT_ASKPASS=/tmp/git-askpass.sh \
            git -c "http.https://github.com/.extraheader=" \
            push \
            "https://x-access-token@github.com/jiminxha/NextTime.git" \
            "HEAD:refs/heads/${TARGET_BRANCH}" \
            --force \
            2>/tmp/git-push.err
          PUSH_STATUS=$?
          set -e

          if [ "${PUSH_STATUS}" -ne 0 ]; then
            sed 's/[A-Za-z0-9_\-]\{20,\}/[redacted]/g' /tmp/git-push.err
            echo "::error::git push to jiminxha/NextTime failed with exit ${PUSH_STATUS}."
            exit "${PUSH_STATUS}"
          fi

          echo "Synced ${TARGET_BRANCH} to jiminxha/NextTime"
