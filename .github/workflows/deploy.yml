## 현재 Vercel 배포는 organization이 아니라 fork한 jiminxha의 개인 레포로 되어 있음

## deploy.yml은 Organization의 frontend(main) 브랜치에 push(merge)하는 경우
## jiminxha의 fork한 레포의 frontend(main) 브랜치에 push 내용을 그대로 가져오는 CI/CD
## fork 레포의 브랜치에 push되면 그 이후에는 연동된 Vercel이 자동 재배포

# [최종 배포 시]
# main으로 병합한 뒤 Vercel Production main 브랜치로 재배포 시
# "main 변경" 표시에 main으로 변경
# push to main일 경우 작동하도록 !
name: Deploy

on:
  push:
    branches: ["frontend"]

jobs:
  sync-to-fork:
    if: github.repository == 'NEXTiME-LikeLion/NextTime'
    runs-on: ubuntu-latest

    steps:
      # 1. Organization 레포 checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2. AUTO_ACTIONS 토큰으로 fork 레포 접근 테스트
      - name: Test fork repository access
        env:
          GH_TOKEN: ${{ secrets.AUTO_ACTIONS }}
        run: |
          echo "Testing access to jiminxha/NextTime..."

          git ls-remote \
            "https://x-access-token:${GH_TOKEN}@github.com/jiminxha/NextTime.git"

          echo "✅ Successfully accessed jiminxha/NextTime"

      # 3. Organization → 개인 fork 동기화
      - name: Sync frontend branch to fork
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.AUTO_ACTIONS }}
        with:
          source-directory: "."
          destination-github-username: jiminxha
          destination-repository-name: NextTime
          user-email: ${{ secrets.EMAIL }}
          commit-message: ${{ github.event.head_commit.message }}
          target-branch: frontend
          create-target-branch-if-needed: true
