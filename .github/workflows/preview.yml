## Organization 레포에서 frontend / dev / main 대상 PR이 열리면
## Vercel Preview를 배포하고 PR 댓글로 Preview URL을 남긴다.
##
## Production 전환 이후에도 feature → dev → main PR에서 Preview를 확인할 수 있다.
## frontend 대상은 전환 기간 동안만 유지한다.

name: Preview

on:
  pull_request:
    branches: ["frontend", "dev", "main"]
    paths:
      - "frontend/**"
      - ".github/workflows/preview.yml"

jobs:
  vercel-preview:
    runs-on: ubuntu-latest

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Check Vercel Authentication
        run: vercel whoami --token=${{ secrets.VERCEL_TOKEN }}

      - name: Install Dependencies
        working-directory: frontend
        run: npm install

      - name: Build Project
        working-directory: frontend
        run: npm run build

      # 반드시 repository root에서 실행
      # Vercel 프로젝트 연결은 VERCEL_ORG_ID / VERCEL_PROJECT_ID secrets 사용
      - name: Deploy Preview to Vercel
        id: deploy
        run: |
          url="$(vercel deploy --token=${{ secrets.VERCEL_TOKEN }})"

          alias="pr-${{ github.event.pull_request.number }}-next-time.vercel.app"

          vercel alias set \
            "$url" \
            "$alias" \
            --token=${{ secrets.VERCEL_TOKEN }}

          echo "preview_url=https://$alias" >> "$GITHUB_OUTPUT"

      - name: Comment PR with Preview URL
        uses: thollander/actions-comment-pull-request@v2
        with:
          message: |
            ✅ PREVIEW ${{ steps.deploy.outputs.preview_url }}

permissions:
  contents: read
  pages: write
  deployments: write
  id-token: write
  issues: write
  pull-requests: write
