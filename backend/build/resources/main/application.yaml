spring:
  application:
    name: nextime-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/nextime}
    username: ${DB_USERNAME:nextime}
    password: ${DB_PASSWORD:nextime}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

mqtt:
  broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
  client-id: ${MQTT_CLIENT_ID:nextime-backend-demo}
  topic: ${MQTT_TOPIC:esp32/button}
