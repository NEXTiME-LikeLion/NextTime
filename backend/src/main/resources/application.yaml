spring:
  application:
    name: nextime-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/nextime}
    username: ${DB_USERNAME:nextime}
    password: ${DB_PASSWORD:nextime}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

app:
  security:
    cognito:
      issuer-uri: ${COGNITO_ISSUER_URI:https://cognito-idp.ap-northeast-2.amazonaws.com/ap-northeast-2_bOOYBSeMP}
      jwk-set-uri: ${COGNITO_JWK_SET_URI:https://cognito-idp.ap-northeast-2.amazonaws.com/ap-northeast-2_bOOYBSeMP/.well-known/jwks.json}
      app-client-id: ${COGNITO_APP_CLIENT_ID:local-app-client}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  ai:
    provider: ${AI_PROVIDER:mock}
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-5.4-mini}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}

mqtt:
  broker-url: ${MQTT_BROKER_URL:tcp://broker.emqx.io:1883}
  client-id: ${MQTT_CLIENT_ID:nextime-backend-inha02-e9b53d4b}
  topic: ${MQTT_TOPIC:nextime/inha02/e9b53d4b/button}

# Demo deployment defaults. Move the private key to a CI/CD secret before public production use.
web-push:
  public-key: ${WEB_PUSH_PUBLIC_KEY:BHthC4Gfm778RfmayKaoPUGZxAVGtflbb0fwYke-sCq18vpaijdjXK7ullma8YnkQ5DVUNM5h0W8X2MjZXZvwfY}
  private-key: ${WEB_PUSH_PRIVATE_KEY:5ZP3hfPt1jL7Qf60PY6ISCHuEmndVE9SlHygjIJZCvQ}
  subject: ${WEB_PUSH_SUBJECT:mailto:nextime@example.com}
