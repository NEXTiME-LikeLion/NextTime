<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <!-- viewport-fit=cover: 노치/홈인디케이터까지 화면을 확장해야 env(safe-area-inset-*)가 생김 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#00D579" />

  <!-- iOS 홈화면 앱(standalone). Safari 탭에서 여는 동안에는 URL바가 그대로 보임 -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="NEXTiME" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <title>NEXTiME</title>
</head>

<body>
  <div id="root"></div>
  <script>
    if (window.navigator.standalone || window.matchMedia("(display-mode: standalone)").matches) {
      document.documentElement.classList.add("standalone");
    }
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
